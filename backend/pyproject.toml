[project]
name = "perfict-ai-backend"
version = "0.1.0"
description = "Local-first AI personal finance assistant backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "google-auth>=2.30.0",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.130.0",
    "pydantic>=2.7.0",
    "google-genai>=1.73.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
# Tests live in tests/ but import top-level modules (routers, db, …), so put the
# backend root on sys.path.
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
